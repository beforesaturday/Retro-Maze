<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Maze - Neon</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #f0f0f0;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
            display: none;
            background: #000;
        }
        #menu, #victory {
            text-align: center;
            padding: 20px;
        }
        h1 { color: #ff1493; text-shadow: 0 0 10px #ff1493; font-size: 3rem; }
        .btn {
            background: transparent;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.2rem;
            transition: 0.3s;
            display: inline-block;
        }
        .btn:hover { 
            background: #00ffff; 
            color: #0a0a0a; 
            box-shadow: 0 0 15px #00ffff;
        }
        #history { 
            margin-top: 20px; 
            color: #39ff14; 
            font-size: 0.9em; 
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>Retro Maze</h1>
        <button class="btn" onclick="startGame(15)">1 - Fácil</button>
        <button class="btn" onclick="startGame(25)">2 - Medio</button>
        <button class="btn" onclick="startGame(35)">3 - Difícil</button>
        <div id="history-container">
            <h3>HISTORIAL</h3>
            <div id="history"></div>
        </div>
    </div>

    <div id="victory" style="display:none;">
        <h1 style="color: #ff1493;">¡HAS GANADO!</h1>
        <p id="final-time" style="color: #39ff14; font-size: 1.5rem;"></p>
        <button class="btn" onclick="showMenu()">Volver al Menú</button>
    </div>

    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let maze = [];
        let player = {x: 1, y: 1};
        let goal = {x: 0, y: 0};
        let startTime;
        let gameActive = false;
        let currentSize = 0;
        let cellSize = 0;

        const NEON_BLUE = "#00ffff";
        const NEON_PINK = "#ff1493";
        const NEON_GREEN = "#39ff14";

        function generateMaze(size) {
            let m = Array(size).fill().map(() => Array(size).fill(1));
            function carve(x, y) {
                const dirs = [[0, 2], [0, -2], [2, 0], [-2, 0]].sort(() => Math.random() - 0.5);
                for (let [dx, dy] of dirs) {
                    let nx = x + dx, ny = y + dy;
                    if (nx > 0 && nx < size && ny > 0 && ny < size && m[ny][nx] === 1) {
                        m[ny][nx] = 0;
                        m[y + dy/2][x + dx/2] = 0;
                        carve(nx, ny);
                    }
                }
            }
            m[1][1] = 0;
            carve(1, 1);
            return m;
        }

        function startGame(size) {
            currentSize = size;
            cellSize = 600 / size;
            maze = generateMaze(size);
            player = {x: 1, y: 1};
            goal = {x: size - 2, y: size - 2};
            maze[goal.y][goal.x] = 0; // Asegurar salida
            
            document.getElementById('menu').style.display = 'none';
            document.getElementById('victory').style.display = 'none';
            canvas.style.display = 'block';
            
            startTime = Date.now();
            gameActive = true;
            requestAnimationFrame(draw);
        }

        function draw() {
            if (!gameActive) return;

            ctx.fillStyle = "#0a0a0a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < currentSize; y++) {
                for (let x = 0; x < currentSize; x++) {
                    if (maze[y][x] === 1) {
                        ctx.strokeStyle = NEON_BLUE;
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    }
                }
            }

            // Meta
            ctx.fillStyle = NEON_GREEN;
            ctx.shadowBlur = 10;
            ctx.shadowColor = NEON_GREEN;
            ctx.fillRect(goal.x * cellSize + 4, goal.y * cellSize + 4, cellSize - 8, cellSize - 8);

            // Jugador
            ctx.fillStyle = NEON_PINK;
            ctx.shadowColor = NEON_PINK;
            ctx.fillRect(player.x * cellSize + 4, player.y * cellSize + 4, cellSize - 8, cellSize - 8);
            
            ctx.shadowBlur = 0;

            // UI Tiempo
            let seconds = Math.floor((Date.now() - startTime) / 1000);
            ctx.fillStyle = NEON_GREEN;
            ctx.font = "20px Consolas";
            ctx.fillText(`Tiempo: ${seconds}s`, 15, canvas.height - 15);

            requestAnimationFrame(draw);
        }

        window.addEventListener('keydown', e => {
            if (!gameActive) return;
            let nx = player.x, ny = player.y;
            if (e.key === "ArrowUp") ny--;
            if (e.key === "ArrowDown") ny++;
            if (e.key === "ArrowLeft") nx--;
            if (e.key === "ArrowRight") nx++;

            if (maze[ny] && maze[ny][nx] === 0) {
                player.x = nx;
                player.y = ny;
                if (player.x === goal.x && player.y === goal.y) win();
            }
        });

        function win() {
            gameActive = false;
            let finalTime = Math.floor((Date.now() - startTime) / 1000);
            saveRecord(finalTime);
            
            setTimeout(() => {
                canvas.style.display = 'none';
                document.getElementById('victory').style.display = 'block';
                document.getElementById('final-time').innerText = `TIEMPO: ${finalTime} segundos`;
            }, 300);
        }

        function saveRecord(time) {
            let history = JSON.parse(localStorage.getItem('mazeHistory') || '[]');
            history.push({ date: new Date().toLocaleDateString(), time: time });
            localStorage.setItem('mazeHistory', JSON.stringify(history));
        }

        function showMenu() {
            document.getElementById('victory').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            loadHistory();
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('mazeHistory') || '[]');
            let html = history.slice(-5).reverse().map(r => `<div>${r.date} — ${r.time}s</div>`).join('');
            document.getElementById('history').innerHTML = html || "Sin partidas registradas";
        }

        loadHistory();
    </script>
</body>
</html>
